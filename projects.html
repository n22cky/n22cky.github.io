---
title: projects
---
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>projects</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<link rel="shortcut icon" type="image/x-icon" href="/images/favicon.png">
<style>
  body { margin: 3rem 1rem; text-align: center; }

  .menu {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1rem clamp(2rem, 8vw, 6rem);
    margin: 0 0 4rem 0;
  }
  .menu a, .menu a:visited, .menu a:hover, .menu a:active,
  .item a, .item a:visited, .item a:hover, .item a:active {
    color: inherit;
    text-decoration: none;
  }

  /* the shop grid: as many columns as fit, each item centered */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 3.5rem 2rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .item { margin: 0; }
  .item img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;          /* shows the whole work, never crops it */
    margin-bottom: 0.75rem;
  }
  .item figcaption { line-height: 1.5; }
</style>
</head>
<body>

<nav class="menu">
  <a href="/">home</a>
  <a href="/projects.html">projects</a>
  <a href="/cv.html">cv</a>
  <a href="/contact.html">contact</a>
</nav>

{% assign items = site.projects | sort: 'date' | reverse %}
<div class="grid">
{% for p in items %}
  {% assign more = p.content | strip %}
  <figure class="item">
    {% if more != '' %}
      <a href="{{ p.url }}"><img src="{{ p.image }}" alt="{{ p.title }}" loading="lazy"></a>
      <figcaption><a href="{{ p.url }}">{{ p.title }}</a><br>{{ p.medium }}</figcaption>
    {% else %}
      <img src="{{ p.image }}" alt="{{ p.title }}" loading="lazy">
      <figcaption>{{ p.title }}<br>{{ p.medium }}</figcaption>
    {% endif %}
  </figure>
{% endfor %}
</div>

<script src="/scramble.js"></script>
</body>
</html>
